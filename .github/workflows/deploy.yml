# 프론트 레포 main을 받아 스타일가이드를 만들고 GitHub Pages에 올린다.
# - 이 레포 main에 올리면 바로
# - 매일 새벽 4시(한국 시간)에 한 번: 프론트에서 바뀐 토큰과 컴포넌트를 따라간다
# - Actions 탭에서 손으로도 돌릴 수 있다
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
